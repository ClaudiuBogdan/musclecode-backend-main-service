# SonarQube Project Configuration
sonar.projectKey=ClaudiuBogdan_musclecode-backend-main-service_5a123eef-069d-482f-963a-7852d2c1c107
sonar.projectName=MuscleCode Backend Main Service
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclude files from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/test/**

# TypeScript specific settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Code coverage settings
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/test/**,**/main.ts

# Source encoding
sonar.sourceEncoding=UTF-8

# Additional settings for better analysis
sonar.javascript.lcov.reportPaths=coverage/lcov.info
